<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" fill="none">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A0EF4"/>
      <stop offset="0.55" stop-color="#3B2CF6"/>
      <stop offset="1" stop-color="#0078FF"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A0EF4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0078FF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <!-- Phone -->
  <rect x="96" y="150" width="150" height="270" rx="28" fill="url(#soft)" stroke="url(#b)" stroke-width="6"/>
  <rect x="146" y="166" width="50" height="10" rx="5" fill="url(#b)"/>
  <!-- Balance and send button on screen -->
  <rect x="122" y="206" width="70" height="10" rx="5" fill="url(#b)" opacity="0.55"/>
  <rect x="122" y="226" width="100" height="22" rx="8" fill="url(#b)"/>
  <rect x="122" y="268" width="98" height="38" rx="12" stroke="url(#b)" stroke-width="4" opacity="0.7"/>
  <circle cx="141" cy="287" r="9" fill="url(#b)" opacity="0.8"/>
  <rect x="158" y="281" width="48" height="6" rx="3" fill="url(#b)" opacity="0.6"/>
  <rect x="158" y="292" width="30" height="5" rx="2.5" fill="url(#b)" opacity="0.4"/>
  <rect x="122" y="318" width="98" height="38" rx="12" stroke="url(#b)" stroke-width="4" opacity="0.45"/>
  <rect x="122" y="372" width="98" height="28" rx="14" fill="url(#b)"/>
  <!-- Paper plane leaving the phone -->
  <path d="M262 214 L360 166 L322 262 L300 224 Z" fill="url(#soft)" stroke="url(#b)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M300 224 L360 166" stroke="url(#b)" stroke-width="5" stroke-linecap="round"/>
  <!-- Flight path to the coin -->
  <path d="M372 150 C 410 110, 418 80, 396 56" stroke="url(#b)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- Arriving coin -->
  <circle cx="404" cy="48" r="34" fill="url(#soft)" stroke="url(#b)" stroke-width="6"/>
  <path d="M404 30 V66 M414 38 C 410 33, 394 33, 394 41 C 394 49, 414 47, 414 55 C 414 63, 398 63, 394 58" stroke="url(#b)" stroke-width="5" stroke-linecap="round"/>
  <!-- @ bubble -->
  <rect x="290" y="300" width="150" height="56" rx="28" fill="url(#soft)" stroke="url(#b)" stroke-width="5"/>
  <circle cx="320" cy="328" r="12" stroke="url(#b)" stroke-width="4"/>
  <circle cx="320" cy="328" r="4" fill="url(#b)"/>
  <rect x="342" y="320" width="76" height="8" rx="4" fill="url(#b)" opacity="0.7"/>
  <rect x="342" y="334" width="48" height="6" rx="3" fill="url(#b)" opacity="0.4"/>
  <!-- Speed lines -->
  <path d="M250 300 H 276 M240 318 H 262" stroke="url(#b)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
